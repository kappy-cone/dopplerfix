# Shared setup for .github/workflows/tests.yml: Python, a cached virtualenv with requirements.txt, and the
# geoid grids in data/proj.
name: setup-env
description: Install Python, restore (or build) the cached .venv, and restore (or fetch) the geoid grids.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      id: py
      with:
        python-version: "3.12"            # the venv's version (requirements.txt header)
    # The whole virtualenv is cached, keyed on the exact Python and requirements.txt. A hit skips pip
    # entirely (about 20 s saved); a miss builds it once and saves it for the next runs.
    - name: Restore virtualenv
      id: venv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
    - name: Build virtualenv
      if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv .venv
        .venv/bin/pip install --disable-pip-version-check -q -r requirements.txt
    - name: Use virtualenv
      shell: bash
      run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    # Geoid grids (CLAUDE.md Known pitfalls). tests/test_geo.py skips its grid test without them, so a
    # failed fetch must not fail CI, but it must be visible, and an empty folder must never be cached.
    - name: Restore geoid grids
      id: proj
      uses: actions/cache/restore@v6
      with:
        path: data/proj
        key: proj-grids-v1
    - name: Fetch geoid grids
      if: steps.proj.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p data/proj
        for f in us_noaa_g2018u0 us_nga_egm96_15; do
          pyproj sync --file "$f" --target-directory data/proj \
            || echo "::warning::pyproj sync failed for $f; the geoid grid test will skip"
        done
    - name: Check geoid grids
      id: grids
      shell: bash
      run: |
        if [ -f data/proj/us_noaa_g2018u0.tif ] && [ -f data/proj/us_nga_egm96_15.tif ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::geoid grids missing from data/proj; tests/test_geo.py will skip its grid test"
        fi
    - name: Save geoid grids
      if: steps.proj.outputs.cache-hit != 'true' && steps.grids.outputs.ok == 'true'
      uses: actions/cache/save@v6
      with:
        path: data/proj
        key: proj-grids-v1
