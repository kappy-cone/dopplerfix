# CI policy: CONTRIBUTING.md §7.
# - gate: every push to any branch, so a PR opens already checked. The fast suite without `heavy` tests, on
#   4 workers. Target about 30 s. A red gate blocks the merge.
# - after-merge: every push to main, or started by hand (Actions tab > tests > Run workflow, or
#   `gh workflow run tests.yml --ref <branch>`). The `heavy` and `slow` tests. It does not block the merge
#   that triggered it, but a red after-merge run on main blocks the next merge until it is fixed.
name: tests
on:
  push:
    paths-ignore:                      # skip runs when every changed file is documentation
      - "**/*.md"
      - "reports/**"                   # reports and experiment scripts; no test imports them
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:                           # a newer push cancels the older run on the same branch;
  group: tests-${{ github.event_name }}-${{ github.ref }}   # a manual run is never cancelled by a push
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  # One BLAS/OpenMP thread per pytest worker: 4 workers on 4 vCPUs, no oversubscription.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: Agg
jobs:
  gate:
    name: gate (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04              # pinned; bump deliberately when GitHub retires it
    timeout-minutes: 5
    strategy:
      fail-fast: false                 # one red shard should not hide the others' results
      matrix:
        shard: [0, 1, 2, 3, 4, 5]      # tests/conftest.py --shard: a hash of the test id, so every test
                                       # runs in exactly one shard and new tests need no bookkeeping
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
      - name: Gate tests (fast, not heavy)
        run: >-
          python -m pytest -m "not slow and not heavy" --shard ${{ matrix.shard }}/6 -n 4 -q
          -p no:cacheprovider --durations=5
  after-merge:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
      - name: Heavy and slow tests
        run: python -m pytest -m "heavy or slow" -n 4 -q -p no:cacheprovider --durations=15
