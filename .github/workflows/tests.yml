# CI policy: CONTRIBUTING.md §7 (what CI checks, what blocks a merge).
# - fast suite (pytest -m "not slow") on every push to main and every pull request, in two parallel shards;
# - slow end-to-end suite (pytest -m slow) only when started by hand (Actions tab > tests > Run workflow,
#   or `gh workflow run tests.yml --ref <branch>`).
name: tests
on:
  push:
    branches: [main]
    paths-ignore: &docs                # skip runs when every changed file is documentation
      - "**/*.md"
      - "reports/**"                   # reports and experiment scripts; no test imports them
      - "docs/**"
      - "doppler.txt"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow suite (pytest -m slow)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:                           # a newer push/PR update cancels the older run on the same ref;
  group: tests-${{ github.event_name }}-${{ github.ref }}   # a manual (slow) run is never cancelled by a push
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  fast:
    name: fast (${{ matrix.shard }})
    runs-on: ubuntu-24.04              # pinned; bump deliberately when GitHub retires it
    timeout-minutes: 15
    strategy:
      fail-fast: false                 # a failure in one shard should not hide the other's result
      matrix:
        # The -k expressions partition the fast suite, so every fast test runs in exactly one shard. The
        # four locked-scoring cases are ~70 % of its time, split into two pairs by parametrize id. Pairs
        # follow measured runner times (0-120 ~84 s, 2-240 ~87 s, 1-60 50-115 s as it pays the process's
        # warm-up, 4-180 21-47 s); re-pair from the --durations table if the critical path moves. Shards
        # can only shift tests between them (scoring-b and rest are complements); if both scoring-a ids go
        # stale, it selects nothing and pytest exits 5 (fails).
        include:
          - shard: scoring-a
            select: "test_true_cell_ranks_first_after_locked_scoring and (1-60.0 or 0-120.0)"
          - shard: scoring-b
            select: "test_true_cell_ranks_first_after_locked_scoring and not (1-60.0 or 0-120.0)"
          - shard: rest
            select: "not test_true_cell_ranks_first_after_locked_scoring"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
      - name: Fast tests
        run: python -m pytest -m "not slow" -k "${{ matrix.select }}" -q --durations=10
  slow:
    if: github.event_name == 'workflow_dispatch' && inputs.slow
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
      - name: Slow tests
        run: python -m pytest -m slow -q --durations=10
