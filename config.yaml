# Configuration for acoustic Doppler geolocation.
# All units SI. Times in config are ISO-8601 UTC strings; internally they become
# float seconds since the Unix epoch. Every tolerance and threshold lives here
# (tests/test_config.py checks each parameter dataclass field has a key).

search:
  mode: regional             # regional | us (US-wide, milestone 7)

region:
  name: synth_boulder        # polygon in regions_path (layer search_regions, field name)
  regions_path: inputs/search_regions.gpkg
  ground_elev_m: 1600.0      # flat-DEM fallback (ellipsoidal) when dem.path is null; synthetic scenarios
  # Synthetic scenarios use the polygon's centroid as ENU origin and its equal-area radius.

dem:
  path: null                 # e.g. data/dem/region.vrt (any CRS; read windowed per grid tile)
  geoid_undulation_m: -16.0  # FALLBACK ONLY (logs a warning) when no geoid grid is found

geoid:                       # orthometric DEM -> ellipsoidal: h = H + N, N sampled from PROJ grids
  grid_dir: data/proj        # copied from QGIS.app (see CLAUDE.md Known pitfalls)
  grids: [us_noaa_g2018u0.tif, us_nga_egm96_15.tif]   # first grid covering a point wins

time_prior:
  mode: known                # known | window | relative
  start_utc: "2026-06-15T14:00:00Z"
  window_utc: null           # [earliest, latest] start when mode == window
  clock_tol_s: 10.0          # Δt prior half-width (known mode): clock error lives here, not in tolerances

environment:
  temperature_c: 20.0        # c = 331.3 + 0.606*T  (20 C -> 343.4 m/s)
  temperature_search_c: null

mic:
  height_agl_m: 1.5

# Main spectrogram: prop tones (1 Hz bins). Resampled to analysis_fs_hz first.
spectrogram:
  analysis_fs_hz: 8000
  window_s: 1.0
  overlap: 0.9
  fmax_hz: 3900.0

# Short-window spectrogram for fast-sweeping jet fan tones (4 Hz bins).
spectrogram_jet:
  analysis_fs_hz: 8000
  window_s: 0.25
  overlap: 0.75
  fmax_hz: 3900.0

detect:
  band_hz: [40, 900]
  bands_hz: [[40, 900]]      # tonal bands on the main spectrogram
  jet_bands_hz: [[900, 3800]]  # tonal bands on the jet spectrogram
  floor_mode: freq           # freq (any clip length) | time (long clips only)
  floor_halfwidth_hz: 20.0
  smooth_s: 3.0
  trigger_db: 10.0           # above baseline (min of clip percentile and noise theory)
  extend_db: 4.0
  baseline_percentile: 20.0
  baseline_theory_slack_db: 1.0
  min_duration_s: 20.0
  pad_s: 5.0
  split_dip_db: 6.0
  chunk_s: 120.0             # audio processed in chunks: memory independent of clip length
  broadband_trigger: true
  manual_windows: []         # e.g. [{start_s: 100, end_s: 220, band_hz: [80, 260]}]
  # U19 detection arms (plan §8.2): off here, so V0/V1 are unchanged; on only in the detection comparison.
  # Sources in reports/apriori_registry.md, registered before the first measurement.
  harmonic_stat: false       # (a) harmonic-summed tonal row per prop band (mean excess at f, 2f, ..., n·f)
  harmonic_n: 3              # PROVISIONAL (as ridge.hough_harmonics): harmonics averaged by arm (a)
  long_window_s: null        # (b) e.g. 3.0: prop bands also scored on a long-window spectrogram (slow props)
  low_band_hz: null          # (c) e.g. [20, 100]: a separate row below the recording high-pass

ridge:                       # prop band, main spectrogram
  max_up_hz_per_s: 4.0
  max_down_hz_per_s: 60.0
  jump_penalty_db_per_hz: 0.5
  weak_db: 12.0
  outlier_hz: 3.0
  min_points: 50
  min_ridge_s: 5.0           # strong ridge points must span at least this long
  harmonic_db: 8.0           # sub-harmonic presence threshold (ridge locked onto a harmonic?)
  max_ridges: 4              # flyovers peeled per window
  mask_halfwidth_hz: 4.0
  guide_hz: 3.0
  guided_passes: 2
  floor_mode: freq
  floor_halfwidth_hz: 20.0
  seed_mode: hough           # hough (Doppler matched filter; robust to crossing ridges) | dp
  hough_dlogf: 0.008
  hough_dt_s: 0.5
  hough_cap_db: 25.0
  hough_harmonics: 3
  hough_dilate_bins: 3
  hough_v_range_mps: [35, 260]
  hough_v_step: 0.12
  hough_tau_range_s: [2, 80]
  hough_tau_step: 0.3
  hough_t0_margin_s: 20.0
  hough_nms_s: 4.0

ridge_jet:                   # jet band, jet spectrogram (keys not given fall back to ridge:)
  max_up_hz_per_s: 15.0
  max_down_hz_per_s: 250.0
  weak_db: 10.0
  outlier_hz: 8.0
  min_ridge_s: 10.0
  guide_hz: 8.0
  mask_halfwidth_hz: 10.0
  hough_harmonics: 1

fit:
  v_bounds_mps: [10, 320]
  d_bounds_m: [20, 30000]
  t0_margin_s: 60.0
  corr_inflation: null       # null -> from residual autocorrelation (>= sqrt(window/hop))
  outlier_sigma: 4.0
  min_descent_frac: 0.02
  f0_drift_prior_per_s: 1.0e-4

# PROVISIONAL until milestone 4.5 (real-data calibration): the jet/prop decision thresholds
# below (harmonic_weak_db, prop_min_harmonics, jet_min_broadband_rise_db). Don't tune against synthetic data.
classify:
  prop_band_hz: [40, 900]
  jet_band_hz: [900, 3800]
  broadband_band_hz: [150, 3500]
  broadband_percentile: 20.0
  harmonic_weak_db: 8.0
  max_harmonic: 5
  prop_min_harmonics: 1
  jet_min_broadband_rise_db: 12.0
  dedupe_dt_s: 3.0
  dedupe_v_frac: 0.15
  dedupe_d_frac: 0.35         # same aircraft on two tone families (fundamental / half-order / harmonic)
  dedupe_ratio_tol: 0.03
  min_aircraft_speed_mps: 25.0   # PROVISIONAL: slower Doppler sources are ground vehicles

tracks:
  source: csv                # csv | parquet | opensky (milestone 7)
  path: data/tracks.csv
  columns: {}                # extra column-name mappings onto the canonical schema
  resample_s: 0.25
  max_gap_s: 20.0
  max_speed_mps: 350.0
  outlier_m: 300.0
  alt_outlier_m: 150.0
  min_points: 5
  min_geometric_frac: 0.5
  velocity_source: adsb      # adsb | derivative

aircraft_types:
  registry_path: data/aircraft_db.csv   # OpenSky-style: icao24, typecode[, icaoaircrafttype]
  type_table_path: null                 # optional ICAO Doc 8643 table: typecode, description

grid:
  spacing_m: 200
  crs: auto                  # auto -> UTM zone (regional) or EPSG:5070 (us)

# Cascade tolerances per event: tol = √((n_sigma·w_cov·σ)² + sys²) + grid term.
#   σ from the fit covariance; w_cov = truncated_tol_mult per edge-clipped side;
#   sys: v ← wind; d ← height ⊕ d·wind/v (d = v·τ); t ← timing ⊕ d·wind/c²;
#   grid term (hard bound, added linearly): δd ≤ h, δT ≤ h/v + h/c, h = half cell diagonal.
cascade:
  n_sigma: 3.0
  truncated_coverage: 2.0    # coverage (in d/v) below this on a side -> widen σ
  truncated_tol_mult: 2.0
  wind_sys_mps: 15.0         # PROVISIONAL until milestone 4.5
  height_sys_m: 30.0         # PROVISIONAL: DEM + geoid + ADS-B geometric altitude error
  timing_sys_s: 1.0          # PROVISIONAL: straight-line t0 bias on curved/climbing tracks
  baro_alt_tol_m: 150.0      # extra height allowance for barometric-altitude tracks
  gof_widening: true         # σ × max(1, fit rms / ridge noise): reduced-χ² scaling for systematic misfit
  tile_cells: 128            # grid tile edge (cells); the full grid is never built at once
  window_pad_s: 2.0
  prune_height_margin_m: 5000.0   # tile-pruning bound on ground height (not a tolerance)
  # PROVISIONAL until milestone 4.5. Used by the silence filter (and synth decoy placement).
  # unknown-class tracks use the smallest value, so the silence filter stays lenient on type gaps.
  audible_slant_m: {prop: 3000.0, jet: 6000.0, unknown: 3000.0}
  silence_mode: reject       # reject | count
  silence_max_unexplained: 0
  silence_min_audible_s: 20.0   # PROVISIONAL: in-clip audible time for a pass to be expected (≈ detect.min_duration_s)
  silence_dt_s: 1.0          # track decimation for the silence index
  explain_time_tol_s: 20.0
  silence_audibility: probabilistic   # probabilistic: reject only near-certain misses, penalise the rest | hard: slant < threshold
  silence_level_sigma_db: 6.0   # PROVISIONAL: source-level scatter (dB) about the class audibility threshold
  silence_hard_prob: 0.99       # reject a cell when an unexplained pass is audible with at least this probability
  max_unmatched_events: 1       # events allowed without a track (cars, birds, aircraft without ADS-B)
  silence_explain: cpa        # cpa: an audible pass is explained only by a CPA-consistent pass of that track | time: by any compatible event in time (lenient)
  # Phase 0 (reports/combined_plan.md P0.1-i). A-priori values, set before any measurement (P0.7):
  max_event_radius_m: 12000.0   # PROVISIONAL; source: 2 × the largest audible slant. Caps an event's CPA search radius
  weak_event_rel_sigma: 0.5     # PROVISIONAL; source: arbitrary. σ_d/d above this: scored, doesn't gate pruning (V0: null)
  max_partial_per_cell: 16      # PROVISIONAL; source: arbitrary. Partial (≥ 1 unmatched) hypotheses per cell
  enum_budget_per_cell: 5000    # PROVISIONAL; source: arbitrary. Best-first enumeration budget per cell

# Named design variants (HANDOFF "Two design variants"; reports/combined_plan.md P0.0). An overlay is
# deep-merged onto this file by `cli.py locate --variant NAME` and by the ablation driver. The base file
# is V1. Both variants are kept and compared side by side; the as-designed code is tagged
# `variants-asdesigned`.
variants:
  V0:                        # original strict design (milestones 4-5): every event matched, hard silence
    cascade: {max_unmatched_events: 0, silence_audibility: hard, weak_event_rel_sigma: null}
  V1: {}                     # current robust default: <= 1 unmatched event (lexicographic), probabilistic silence
  # P1.1 + P1.4 comparison arms (never defaults; U18 decides): the calibrated likelihood and ambiguity v2
  V1c:
    score: {likelihood: calibrated, ambiguity_mode: v2}
  V0c:
    cascade: {max_unmatched_events: 0, silence_audibility: hard, weak_event_rel_sigma: null}
    score: {likelihood: calibrated, ambiguity_mode: v2}

score:                       # locked N-event scoring: one shared Δt, one f0 per event
  dt_coarse_step_s: 0.5      # coarse Δt grid over each hypothesis' feasible interval, then bounded refinement
  dt_pad_s: 1.0              # widen that interval (still inside the time prior)
  ridge_decimate_s: 0.5      # one median ridge point per bin
  huber_k: 3.0               # robust loss threshold, in units of the event's ridge scatter
  sigma_floor_hz: 0.05       # floor on ridge scatter σ
  top_n: 10
  refine_in_cell: true       # cell score = best point inside the cell (±half spacing), not its centre
  refine_max_cells: 500      # refine the best N cells by centre score
  refine_dt_window_s: 3.0    # Δt half-width around the centre's Δt while refining
  silence_weight: 1.0        # probabilistic-silence penalty (nats) added to the pooled loss
  ambiguity_rel: 0.15        # PROVISIONAL: candidates within 15% of the best score are tied
  inconsistent_rms_sigma: 3.0  # PROVISIONAL (P0.4; source: 3σ convention): rank-1 rms > this × model-free ridge scatter -> "inconsistent"
  ambiguity_radius_m: 400.0  # tied set within this of rank 1 -> unique, else ambiguous
  allow_shared_tracks: false # forbid assigning one aircraft to two events
  max_hypotheses_per_cell: 64
  # P1.1 calibrated likelihood + P1.4 ambiguity v2: comparison arms only (variants V1c/V0c); values and sources
  # are in reports/apriori_registry.md and were fixed before the first measurement.
  likelihood: huber          # huber (step 8 as written) | calibrated (P1.1 arm)
  outlier_frac: 0.05         # PROVISIONAL (arbitrary): ε, per-point outlier mixture weight
  adsb_pos_m: 7.0            # PROVISIONAL (DO-260B NACp class): ADS-B position budget
  adsb_speed_mps: 0.26       # PROVISIONAL (1 kt quantization / 2): ADS-B speed budget
  adsb_latency_s: 0.5        # PROVISIONAL (OpenSky latency literature): ADS-B timestamp budget
  sigma_inflation_cap: 3.0   # PROVISIONAL (plan P1.1; arbitrary): σ_e within [σ_white, 3·σ_white]
  ambiguity_mode: v1         # v1 (relative score tie) | v2 (P1.4: Δnll tie set, assignment gap, gof, locus)
  tie_quantile: 0.95         # PROVISIONAL (statistics): tied if 2·Δnll ≤ χ²₂ quantile
  gof_quantile: 0.99         # PROVISIONAL (statistics): "inconsistent" if an event's χ²(N_eff) exceeds this quantile

# Validation (doppler/evaluate.py; user decision U10). Fixed now, before any Phase 0 baseline result.
evaluate:
  success_radius_m: 200.0    # headline estimate within this of the truth (does not follow grid.spacing_m)
  confident_wrong_m: 1000.0  # "unique" and farther than this: confident-wrong
  match_tol_s: 10.0          # truth event <-> detected event, by received CPA time
  hop_ratio_tol: 0.015       # harmonic-hop diagnostic: ridge/model ratio this close to a simple ratio ≠ 1

outputs:
  root: outputs
  keep_runs: 5               # cli.py clean keeps the newest N runs
  write_grid: auto           # auto: regional runs only | true | false
  max_raster_cells: 50000000 # score.tif built in memory below this; above, a sparse tiled GeoTIFF
  top_plot: 3                # candidates drawn in the static spectrogram plot

viewer:
  plotly_version: 2.35.2     # outputs/plotly.min.js, from https://cdn.plot.ly/plotly-2.35.2.min.js
  plotly_sha256: 6d21266ce1bd7d9e5ab4e115989c70c20de0382fd973a8f26ab58619eba4d603
  max_time_px: 1500          # display-only downsampling of the spectrogram
  max_freq_px: 400
  max_candidates: 20

synth:
  seed: 0
  n_cascade_decoys: 3        # cli synth --cascade-decoys: decoys over CPA/offset survivors far from the mic
  duration_s: 600
  fs_hz: 8000
  n_tracks: 3                # legacy layout, used only when event_rx_times_s is null
  event_rx_times_s: [150, 420]   # received CPA times of the events (any count, any clip length)
  event_classes: [prop, prop]
  snr_db: 10.0               # event tone power at its CPA vs noise power in noise_band_hz
  noise_band_hz: [40, 1000]
  harmonic_amps: [1.0, 0.5, 0.3]
  f0_range_hz: [80, 180]
  speed_range_mps: [35, 90]
  alt_agl_range_m: [300, 900]
  offset_range_m: [0, 1500]     # 0 = directly overhead
  jet_f0_range_hz: [900, 2200]
  jet_harmonic_amps: [1.0, 0.3]
  jet_speed_range_mps: [75, 130]
  jet_alt_agl_range_m: [400, 1500]
  jet_broadband_band_hz: [150, 3500]
  jet_broadband_to_tone_db: 5.0
  excess_atten_db_per_km: 3.0
  f0_jitter_frac: 0.002
  broadband_to_tone_db: 0.0
  curved_fraction: 0.34
  ref_distance_m: 1000.0
  prop_snr_at_ref_db: -5.0   # non-event source levels: low enough that decoys at 1.2x threshold are inaudible
  jet_snr_at_ref_db: 12.0
  event_max_slant_frac: 0.6
  n_decoys_per_event: 2
  n_twins_per_event: 2
  n_background: 10
  decoy_target_slant_frac: 0.8
  inaudible_margin: 1.2
  skip_audio_beyond_m: 8000.0
  unknown_type_frac: 0.1
  track_dt_s: 0.25
  track_pad_before_s: 180.0
  track_pad_after_s: 60.0
  mic_max_offset_m: 3000.0
  # audible_slant_m and region_radius_m come from cascade: and region:

# Realism layer for synthetic scenarios (doppler/realism.py): what real recordings and ADS-B do that a
# clean forward model doesn't (skeptic review, session 3). Scenario settings, not pipeline thresholds.
# `cli.py synth --clean` turns every effect off (the milestone 1-5 scenarios).
realism:
  adsb_degrade: true
  adsb_interval_s: 1.0
  adsb_interval_jitter_s: 0.3
  adsb_latency_s: 0.6
  adsb_pos_sigma_m: 7.0
  adsb_mlat_frac: 0.03
  adsb_mlat_sigma_m: 100.0
  adsb_geo_alt_sigma_m: 10.0
  adsb_alt_quant_ft: 25.0
  adsb_baro_only_frac_prop: 0.3
  adsb_baro_offset_sigma_m: 60.0
  adsb_speed_quant_kt: 1.0
  adsb_vrate_quant_fpm: 64.0
  adsb_gap_rate_per_min: 0.2
  adsb_gap_s: [5.0, 60.0]
  adsb_drop_prop_frac: 0.0
  level_model: shared
  level_sigma_db: 6.0
  event_min_snr_db: 0.0
  harmonic_model: rich
  n_harmonics: 10
  harmonic_slope_db: -3.0
  harmonic_scatter_db: 6.0
  half_order_db: -12.0
  rpm_walk_frac: 0.003
  rpm_ramp_prob: 0.3
  rpm_ramp_frac: [0.03, 0.1]
  twin_prob: 0.3
  twin_detune_frac: [0.002, 0.01]
  directivity_db: 6.0
  absorption: iso9613
  humidity_pct: 70.0
  ground_reflection: true
  reflection_coef: [0.8, 1.0]
  wind_max_mps: 10.0
  c_mismatch_mps: 3.0
  noise_model: realistic
  wind_noise_db: 6.0
  hum_db: -10.0
  n_car_passes: 2
  car_db: 10.0
  n_bird_chirps: 20
  bird_db: 0.0
  highpass_hz: 100.0
  agc_strength: 0.5
  clock_offset_max_s: 5.0
  corridor_frac: 0.5
  corridor_spread_deg: 20.0
  climb_prob: 0.4
  climb_mps: [3.0, 5.0]
  speed_ramp_prob: 0.3
  speed_ramp_frac: 0.1
  turn_rate_max_deg_s: 3.0
  n_near_traffic: 4
  mic_height_range_m: [1.0, 10.0]
